#####################################################################
# Per-tool Spoolman tracking for the Boss (added 2026-10-04)
#
# Plain English:
# - Moonraker can only bill filament to ONE active spool at a time.
# - Each tool gets its own spool: pick it per tool in Mainsail's Spoolman
#   panel ("Change Spool" -> T0..T3). Mainsail stores it in
#   [gcode_macro Tn].spool_id and in variables.cfg (t0__spool_id ...).
# - Spools belong to the PHYSICAL toolhead number. Tool remapping
#   (SET_TOOL_MAPPING) does not move spools.
# - _TC_SYNC_SPOOL makes the mounted tool's spool the active one. It runs:
#     * after EVERY tool change ([toolchanger] after_change_gcode), so it
#       also covers START_PRINT / heatsoak / load-unload, which call
#       SELECT_TOOL directly and bypass the T macros
#     * in START_PRINT after the final tool select (undoes Mainsail's habit
#       of making ANY picked spool the global active spool)
#     * after a Klipper restart (RESTORE_SELECTED_SPOOLS)
# - A tool with no spool assigned clears tracking (nothing gets billed to
#   the wrong spool).
# - If Moonraker is down, the remote call is logged by Klipper, never
#   raised, so it cannot abort a tool change.
#####################################################################

[gcode_macro SET_ACTIVE_SPOOL]
description: Set the spool Moonraker bills filament to. ID=<spool id>
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
  {% else %}
    {action_respond_info("SET_ACTIVE_SPOOL: parameter ID is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Stop billing filament to any spool
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

[gcode_macro _TC_SYNC_SPOOL]
description: Make the mounted (or T=<n>) tool's assigned spool the active spool
gcode:
  {% set tn = params.T|default(printer.toolchanger.tool_number)|int %}
  {% set m = "gcode_macro T" ~ tn %}
  {% set sid = printer[m].spool_id if (tn >= 0 and m in printer and printer[m].spool_id is defined) else None %}
  {% if sid is not none and sid|string not in ["None", "", "-1"] %}
    SET_ACTIVE_SPOOL ID={sid}
  {% else %}
    CLEAR_ACTIVE_SPOOL
  {% endif %}

# From the Mainsail docs: put each tool's saved spool back after a restart,
# then sync the active spool to the mounted tool (separate command, so it
# renders AFTER the variables are restored).
[delayed_gcode RESTORE_SELECTED_SPOOLS]
# 10 s, not the 0.1 s from the Mainsail docs: Moonraker must be reconnected
# for the final sync to reach it (at 0.1 s it was a logged "Remote Call Error")
initial_duration: 10
gcode:
  {% set svv = printer.save_variables.variables %}
  {% for object in printer %}
    {% if object.startswith('gcode_macro ') and printer[object].spool_id is defined %}
      {% set macro = object.replace('gcode_macro ', '') %}
      {% set var = (macro + '__SPOOL_ID')|lower %}
      {% if svv[var] is defined %}
        SET_GCODE_VARIABLE MACRO={macro} VARIABLE=spool_id VALUE={svv[var]}
      {% endif %}
    {% endif %}
  {% endfor %}
  _TC_SYNC_SPOOL
