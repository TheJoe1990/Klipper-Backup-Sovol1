#####################################################################
#   MAYBE-DEAD macro usage tracker (added 2026-10-03)
#####################################################################
# Macros flagged "MAYBE-DEAD" had NO callers anywhere on 2026-10-03:
# not from other macros/config, not from any sliced .gcode on the
# printer, not in a Mainsail macro group, not from any toolchanger
# python module. They might still be run by hand, so instead of
# deleting them each one calls _MAYBE_DEAD_HIT as its first line.
#
# Every call bumps a counter in variables.cfg (maybe_dead_hits) and
# prints a console note. Run MAYBE_DEAD_REPORT to see the counts.
# At the revisit: anything still at 0 hits gets removed; anything
# with hits gets un-flagged (delete its _MAYBE_DEAD_HIT line and the
# "# MAYBE-DEAD" comment above it).
#
# Flagged (file):
#   TOOL0 TOOL1 TOOL2 TOOL3 TOOL4   toolchanger/macros.cfg  (TOOL4 calls T4, which doesn't exist)
#   UI_UNSELECT_TOOL                toolchanger/macros.cfg
#   _TAP_PROBE_ACTIVATE             toolchanger/macros.cfg  (Voron Tap leftover)
#   _INITIALIZE_FROM_DETECTED_TOOL  toolchanger/tool_detection.cfg
#   _INITIALIZE_FROM_DETECTED_TOOL_IMPL  toolchanger/tool_detection.cfg  (only called by the one above)
#   _RAISE                          toolchanger/toolchanger.cfg
#   MAINLED_ON MAINLED_OFF          sovol-macros.cfg  (stock Sovol, hidden in Mainsail)
#   BEEP                            options/lcd/macros.cfg  (stock Sovol, hidden in Mainsail)

[gcode_macro _MAYBE_DEAD_HIT]
description: Count a call to a MAYBE-DEAD flagged macro (see maybe_dead_tracker.cfg)
gcode:
    {% set name = params.NAME|default('UNKNOWN')|upper %}
    # Copy the saved dict so we never mutate save_variables' live state
    {% set hits = dict(printer.save_variables.variables.maybe_dead_hits|default({})) %}
    {% set _ = hits.update({name: (hits[name]|default(0)|int) + 1}) %}
    SAVE_VARIABLE VARIABLE=maybe_dead_hits VALUE="{hits}"
    RESPOND TYPE=echo MSG="MAYBE-DEAD macro {name} was used ({hits[name]} calls so far) - it is tracked for cleanup, tell Claude if it should stay"

[gcode_macro MAYBE_DEAD_REPORT]
description: Show how often each MAYBE-DEAD flagged macro has been called since 2026-10-03
gcode:
    {% set flagged = ['TOOL0','TOOL1','TOOL2','TOOL3','TOOL4','UI_UNSELECT_TOOL','_TAP_PROBE_ACTIVATE',
                      '_INITIALIZE_FROM_DETECTED_TOOL','_INITIALIZE_FROM_DETECTED_TOOL_IMPL','_RAISE',
                      'MAINLED_ON','MAINLED_OFF','BEEP'] %}
    {% set hits = printer.save_variables.variables.maybe_dead_hits|default({}) %}
    {% set lines = ["MAYBE-DEAD usage since 2026-10-03 (0 = safe to remove at revisit):"] %}
    {% for m in flagged %}
        {% set _ = lines.append("  " ~ m ~ ": " ~ (hits[m]|default(0))) %}
    {% endfor %}
    {action_respond_info(lines|join("\n"))}
